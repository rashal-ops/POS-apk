name: Build Signed Android App & Bundle

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      # 1. إنشاء مفتاح التوقيع تلقائياً داخل السيرفر بدون كمبيوتر
      - name: Generate Keystore Automatically
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
          -storepass MySecretPass123 -keypass MySecretPass123 \
          -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=POS App, OU=IT, O=POS, L=City, S=State, C=US"

      # 2. إعداد ملف البيانات للمشروع
      - name: Create key.properties
        run: |
          echo "storePassword=MySecretPass123" > android/key.properties
          echo "keyPassword=MySecretPass123" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - run: flutter pub get

      # 3. بناء ملف AAB المخصص لمتجر Google Play
      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      # 4. بناء ملف APK للتثبيت المباشر على الأندرويد
      - name: Build Android APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # 5. حفظ الملفات للتحميل
      - uses: actions/upload-artifact@v3
        with:
          name: google-play-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v3
        with:
          name: direct-install-apk
          path: build/app/outputs/flutter-apk/app-release.apk
